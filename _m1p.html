<!doctype html><html lang="fr"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<link href="https://fonts.googleapis.com/css2?family=DM+Sans:wght@300;400;500&display=swap" rel="stylesheet">
<style>
*{box-sizing:border-box;margin:0;padding:0}
body{font-family:'DM Sans',sans-serif}
.w{max-width:620px;margin:0 auto;padding:44px 20px 48px;text-align:center}
.eb{font-size:10.5px;letter-spacing:.32em;text-transform:uppercase;font-weight:500;margin-bottom:12px}
h2{font-weight:400;font-size:28px;line-height:1.12;margin-bottom:8px}
.sub{font-size:14px;line-height:1.5;margin:0 auto 26px;max-width:30ch}
svg{display:block}
@keyframes spin{to{transform:rotate(360deg)}}
@media (prefers-reduced-motion:reduce){*{animation:none !important}}
body{background:linear-gradient(180deg,#2a150e 0%,#1a0d07 100%);color:#F5EDE3}
.eb{color:#E8CFA0}.sub{color:rgba(245,237,227,.7)}
.deck{position:relative;width:min(300px,78vw);aspect-ratio:1;margin:0 auto 22px}
.glow{position:absolute;inset:-18%;background:radial-gradient(closest-side,rgba(232,207,160,.28),transparent 70%)}
.rec{position:absolute;inset:0;border-radius:50%;background:repeating-radial-gradient(circle at 50% 50%,#120a06 0 2px,#1d110b 2px 4px);box-shadow:0 22px 50px rgba(0,0,0,.6),0 0 0 1px rgba(232,207,160,.25),inset 0 0 0 10px #0d0704;animation:spin 14s linear infinite}
.rec:before{content:"";position:absolute;inset:0;border-radius:50%;background:conic-gradient(from 20deg,transparent 0 20%,rgba(232,207,160,.16) 28%,transparent 36% 70%,rgba(232,207,160,.12) 78%,transparent 86%)}
.lab{position:absolute;left:50%;top:50%;width:44%;aspect-ratio:1;transform:translate(-50%,-50%);border-radius:50%;background:radial-gradient(circle at 38% 32%,#FBF0E3,#EBD3BB 62%,#D9B99A);display:flex;align-items:center;justify-content:center;box-shadow:0 0 0 3px #E8CFA0,0 0 0 5px rgba(42,21,14,.55),inset 0 0 18px rgba(138,90,60,.35)}
.lab img{width:56%;height:auto;display:block;filter:drop-shadow(0 4px 5px rgba(60,30,18,.35))}
.arm{position:absolute;right:-6%;top:-4%;width:36%;height:60%;pointer-events:none}
.now{margin-top:6px}.now b{display:block;font-weight:400;font-size:22px}.now span{display:block;font-size:13px;color:rgba(245,237,227,.6);margin-top:4px;letter-spacing:.04em}
.bar{height:2px;background:rgba(245,237,227,.18);margin:20px auto 18px;max-width:300px;border-radius:2px;position:relative}.bar i{position:absolute;left:0;top:0;bottom:0;width:34%;background:#E8CFA0;border-radius:2px}
.ctl{display:flex;justify-content:center;align-items:center;gap:26px;margin-bottom:28px}
.ctl .pl{width:64px;height:64px;border-radius:50%;background:#E8CFA0;color:#2a150e;display:flex;align-items:center;justify-content:center;box-shadow:0 10px 26px rgba(232,207,160,.3)}
.ctl .sk{width:40px;height:40px;border-radius:50%;border:1px solid rgba(245,237,227,.3);display:flex;align-items:center;justify-content:center;color:#F5EDE3}
.row{display:flex;gap:12px;overflow:hidden;justify-content:center}
.mi{flex:0 0 54px;text-align:center}.mi .c{width:54px;height:54px;border-radius:50%;background:repeating-radial-gradient(circle,#120a06 0 1.5px,#1d110b 1.5px 3px);box-shadow:0 8px 18px rgba(0,0,0,.5);position:relative}
.mi .c:after{content:"";position:absolute;left:50%;top:50%;width:34%;aspect-ratio:1;transform:translate(-50%,-50%);border-radius:50%;background:#8a5848}
.mi.on .c{box-shadow:0 0 0 2px #E8CFA0,0 8px 18px rgba(0,0,0,.5)}.mi small{display:block;font-size:9.5px;color:rgba(245,237,227,.5);margin-top:8px;letter-spacing:.12em}.mi.on small{color:#E8CFA0}

.scr{height:0;overflow:visible;position:relative;margin:0 auto}
.sw{position:relative;width:min(340px,90vw);aspect-ratio:16/9;margin:0 auto;border-radius:16px;overflow:hidden;background:#0b0603;box-shadow:0 0 0 1px rgba(232,207,160,.55),0 22px 44px rgba(0,0,0,.6);clip-path:inset(50% 0 50% 0 round 16px);opacity:0}
.vid,.noise{position:absolute;inset:0}.vid img{width:100%;height:100%;object-fit:cover;display:block}.vid{opacity:0}
.noise{background:url("data:image/svg+xml;utf8,<svg xmlns='http://www.w3.org/2000/svg' width='220' height='220'><filter id='n'><feTurbulence type='fractalNoise' baseFrequency='.9' numOctaves='2' stitchTiles='stitch'/><feColorMatrix values='0 0 0 0 .92  0 0 0 0 .86  0 0 0 0 .78  0 0 0 1.4 -.35'/></filter><rect width='100%' height='100%' filter='url(%23n)'/></svg>");background-color:#150c07;opacity:0;mix-blend-mode:normal}
.noise:after{content:"";position:absolute;inset:0;background:repeating-linear-gradient(180deg,rgba(0,0,0,.35) 0 1px,transparent 1px 3px)}
.skl{position:absolute;inset:0;display:flex;align-items:center;justify-content:center;font-size:20px;letter-spacing:.5em;padding-left:.5em;color:#E8CFA0;opacity:0;text-shadow:0 0 18px rgba(232,207,160,.6)}
.ln{position:absolute;left:0;right:0;top:50%;height:2px;margin-top:-1px;background:#F5EDE3;box-shadow:0 0 14px 2px rgba(232,207,160,.9);opacity:0}
.deck{will-change:transform}
.hint{font-size:11px;letter-spacing:.2em;color:rgba(245,237,227,.5);margin-top:18px;text-transform:uppercase}
</style></head><body><div class="w"><div class="eb">Bienvenue chez Skines</div><h2>Un moment pour vous</h2><p class="sub">Choisissez un disque et laissez la musique faire le reste.</p>
<div class="scr" id="scr"><div class="sw" id="sw"><div class="vid" id="vid"><img src="/assets/card-head-spa.webp" alt=""></div><div class="noise" id="noise"></div><div class="skl" id="skl">SKINES</div><div class="ln" id="ln"></div></div></div><div class="deck" id="deck"><div class="glow"></div><div class="rec"><div class="lab"><img src="/assets/images/logo-officiel-cropped.webp" alt="Skines"></div></div>
<svg class="arm" viewBox="0 0 100 160" fill="none" stroke="#E8CFA0" stroke-width="3" stroke-linecap="round"><circle cx="78" cy="14" r="9" fill="#2a150e"/><path d="M78 23 L78 96 L48 140"/><rect x="38" y="136" width="18" height="12" rx="3" fill="#E8CFA0" stroke="none" transform="rotate(-30 47 142)"/></svg></div>
<div class="now"><b>Om Gam Mantra</b><span>Chantress Seba</span></div><div class="bar"><i></i></div>
<div class="ctl"><span class="sk"><svg width="16" height="16" viewBox="0 0 24 24" fill="currentColor"><path d="M6 5h2v14H6zM20 5v14L9 12z"/></svg></span><span class="pl"><svg width="24" height="24" viewBox="0 0 24 24" fill="currentColor"><path d="M8 5v14l11-7z"/></svg></span><span class="sk"><svg width="16" height="16" viewBox="0 0 24 24" fill="currentColor"><path d="M16 5h2v14h-2zM4 5v14l11-7z"/></svg></span></div>
<div class="row"><div class="mi on"><div class="c"></div><small>01</small></div><div class="mi"><div class="c"></div><small>02</small></div><div class="mi"><div class="c"></div><small>03</small></div><div class="mi"><div class="c"></div><small>04</small></div><div class="mi"><div class="c"></div><small>05</small></div></div>
</div><script>
(function(){
var H=0,sw=document.getElementById('sw'),scr=document.getElementById('scr'),vid=document.getElementById('vid'),noise=document.getElementById('noise'),skl=document.getElementById('skl'),ln=document.getElementById('ln'),deck=document.getElementById('deck');
function cl(x){return x<0?0:x>1?1:x}function eo(x){return 1-Math.pow(1-x,3)}function eio(x){return x<.5?4*x*x*x:1-Math.pow(-2*x+2,3)/2}
function seg(t,a,b){return cl((t-a)/(b-a))}
function render(t){
  var w=sw.offsetWidth,h=w*9/16, open=eio(seg(t,0,1.1)), sp=open;
  scr.style.height=(sp*(h+26))+'px'; scr.style.marginBottom='0px';
  sw.style.marginTop='0px'; sw.style.transform='translateY('+(-(1-sp)*14)+'px) scale('+(.94+.06*sp)+')';
  var clipV=eo(seg(t,.12,.95))*50; sw.style.clipPath='inset('+(50-clipV)+'% 0 '+(50-clipV)+'% 0 round 16px)';
  sw.style.opacity=cl(seg(t,0,.12)*1);
  ln.style.opacity=seg(t,0,.1)*(1-seg(t,.55,.95)); 
  var nOn=seg(t,.45,.8)*(1-seg(t,2.55,3.1)); noise.style.opacity=nOn*.9;
  noise.style.backgroundPosition=((t*977)%220)+'px '+((t*613)%220)+'px';
  skl.style.opacity=seg(t,1.0,1.5)*(1-seg(t,2.3,2.7))*nOn; skl.style.letterSpacing=(.42+.1*seg(t,1,2.6))+'em';
  vid.style.opacity=seg(t,2.45,3.2);
  deck.style.transform='scale('+(1-.1*open)+')'; deck.style.marginTop=(-30*open)+'px'; 
}
window.__render=render;
var q=new URLSearchParams(location.search).get('t');
if(q!==null){render(parseFloat(q));return}
render(0);var run=false;
function go(){ if(run) return; run=true; var t0=performance.now(); (function f(n){ var t=(n-t0)/1000; if(t>3.4){ render(3.4); run=false; return } render(t); requestAnimationFrame(f)})(t0)}
function back(){ if(run) return; run=true; var t0=performance.now(); (function f(n){ var t=3.4-(n-t0)/1000*1.5; if(t<0){ render(0); run=false; return } render(t); requestAnimationFrame(f)})(t0)}
var open=false;document.querySelectorAll('.pl,.rec').forEach(function(e){e.style.cursor='pointer';e.addEventListener('click',function(){ if(!open){ open=true; go() } else { open=false; back() } })});
})();
</script><div style="text-align:center"><div class="hint" style="padding-bottom:30px">اضغط على الأسطوانة أو زر التشغيل</div></div></body></html>
