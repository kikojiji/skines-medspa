<!doctype html><html lang="fr"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<link href="https://fonts.googleapis.com/css2?family=DM+Sans:wght@300;400;500&display=swap" rel="stylesheet">
<style>
*{box-sizing:border-box;margin:0;padding:0}
body{font-family:'DM Sans',sans-serif}
.w{max-width:620px;margin:0 auto;padding:44px 20px 48px;text-align:center}
.eb{font-size:10.5px;letter-spacing:.32em;text-transform:uppercase;font-weight:500;margin-bottom:12px}
h2{font-weight:400;font-size:28px;line-height:1.12;margin-bottom:8px}
.sub{font-size:14px;line-height:1.5;margin:0 auto 26px;max-width:30ch}
svg{display:block}
@keyframes spin{to{transform:rotate(360deg)}}@keyframes bar{0%,100%{height:6px}50%{height:22px}}
@media (prefers-reduced-motion:reduce){*{animation:none !important}}
body{background:radial-gradient(90% 60% at 50% 38%,#6a3f31 0%,#3a1f16 55%,#1d0f0a 100%);color:#F5EDE3}
.eb{color:#E8CFA0}.sub{color:rgba(245,237,227,.7)}
.dl{position:relative;width:min(320px,84vw);aspect-ratio:1;margin:0 auto 18px}
.rg{position:absolute;inset:0;border-radius:50%;border:1px solid rgba(232,207,160,.35);box-shadow:inset 0 0 40px rgba(232,207,160,.08),0 0 60px rgba(182,106,90,.25)}
.rg2{position:absolute;inset:11%;border-radius:50%;border:1px solid rgba(232,207,160,.18)}
.tk{position:absolute;inset:0}.tk i{position:absolute;left:50%;top:50%;width:8px;height:8px;margin:-4px 0 0 -4px;border-radius:50%;background:rgba(245,237,227,.32);transform:rotate(var(--a)) translateY(-50%) translateY(calc(min(160px,42vw)*-1 + 0px))}
.tk i.on{width:14px;height:14px;margin:-7px 0 0 -7px;background:#E8CFA0;box-shadow:0 0 18px rgba(232,207,160,.8)}
.ct{position:absolute;left:50%;top:50%;width:56%;aspect-ratio:1;transform:translate(-50%,-50%);border-radius:50%;background:radial-gradient(circle at 35% 30%,#8a5848,#4a2a22 70%);box-shadow:0 18px 40px rgba(0,0,0,.55),inset 0 0 0 1px rgba(232,207,160,.4);display:flex;flex-direction:column;align-items:center;justify-content:center;gap:8px}
.ct .pp{width:58px;height:58px;border-radius:50%;background:#E8CFA0;color:#2a150e;display:flex;align-items:center;justify-content:center;box-shadow:0 8px 22px rgba(232,207,160,.35)}
.ct small{font-size:10px;letter-spacing:.3em;color:#E8CFA0}
.nm b{display:block;font-weight:400;font-size:23px}.nm span{display:block;font-size:13px;color:rgba(245,237,227,.6);margin-top:4px}
.ar{display:flex;justify-content:center;gap:34px;margin-top:20px;font-size:10.5px;letter-spacing:.24em;text-transform:uppercase;color:rgba(245,237,227,.55)}
</style></head><body><div class="w"><div class="eb">Bienvenue chez Skines</div><h2>Un moment pour vous</h2><p class="sub">Choisissez un disque et laissez la musique faire le reste.</p>
