<!doctype html><html lang="fr"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<link href="https://fonts.googleapis.com/css2?family=DM+Sans:wght@300;400;500&display=swap" rel="stylesheet">
<style>
*{box-sizing:border-box;margin:0;padding:0}
body{font-family:'DM Sans',sans-serif}
.w{max-width:620px;margin:0 auto;padding:44px 20px 48px;text-align:center}
.eb{font-size:10.5px;letter-spacing:.32em;text-transform:uppercase;font-weight:500;margin-bottom:12px}
h2{font-weight:400;font-size:28px;line-height:1.12;margin-bottom:8px}
.sub{font-size:14px;line-height:1.5;margin:0 auto 26px;max-width:30ch}
svg{display:block}
@keyframes spin{to{transform:rotate(360deg)}}
@media (prefers-reduced-motion:reduce){*{animation:none !important}}
body{background:linear-gradient(180deg,#2a150e 0%,#1a0d07 100%);color:#F5EDE3}
.eb{color:#E8CFA0}.sub{color:rgba(245,237,227,.7)}
.deck{position:relative;width:min(300px,78vw);aspect-ratio:1;margin:0 auto 22px}
.glow{position:absolute;inset:-18%;background:radial-gradient(closest-side,rgba(232,207,160,.28),transparent 70%)}
.rec{position:absolute;inset:0;border-radius:50%;background:repeating-radial-gradient(circle at 50% 50%,#120a06 0 2px,#1d110b 2px 4px);box-shadow:0 22px 50px rgba(0,0,0,.6),0 0 0 1px rgba(232,207,160,.25),inset 0 0 0 10px #0d0704;animation:spin 14s linear infinite}
.rec:before{content:"";position:absolute;inset:0;border-radius:50%;background:conic-gradient(from 20deg,transparent 0 20%,rgba(232,207,160,.16) 28%,transparent 36% 70%,rgba(232,207,160,.12) 78%,transparent 86%)}
.lab{position:absolute;left:50%;top:50%;width:34%;aspect-ratio:1;transform:translate(-50%,-50%);border-radius:50%;background:radial-gradient(circle,#8a5848,#684034);color:#F5EDE3;display:flex;align-items:center;justify-content:center;box-shadow:0 0 0 3px #E8CFA0 inset}
.arm{position:absolute;right:-6%;top:-4%;width:36%;height:60%;pointer-events:none}
.now{margin-top:6px}.now b{display:block;font-weight:400;font-size:22px}.now span{display:block;font-size:13px;color:rgba(245,237,227,.6);margin-top:4px;letter-spacing:.04em}
.bar{height:2px;background:rgba(245,237,227,.18);margin:20px auto 18px;max-width:300px;border-radius:2px;position:relative}.bar i{position:absolute;left:0;top:0;bottom:0;width:34%;background:#E8CFA0;border-radius:2px}
.ctl{display:flex;justify-content:center;align-items:center;gap:26px;margin-bottom:28px}
.ctl .pl{width:64px;height:64px;border-radius:50%;background:#E8CFA0;color:#2a150e;display:flex;align-items:center;justify-content:center;box-shadow:0 10px 26px rgba(232,207,160,.3)}
.ctl .sk{width:40px;height:40px;border-radius:50%;border:1px solid rgba(245,237,227,.3);display:flex;align-items:center;justify-content:center;color:#F5EDE3}
.row{display:flex;gap:12px;overflow:hidden;justify-content:center}
.mi{flex:0 0 54px;text-align:center}.mi .c{width:54px;height:54px;border-radius:50%;background:repeating-radial-gradient(circle,#120a06 0 1.5px,#1d110b 1.5px 3px);box-shadow:0 8px 18px rgba(0,0,0,.5);position:relative}
.mi .c:after{content:"";position:absolute;left:50%;top:50%;width:34%;aspect-ratio:1;transform:translate(-50%,-50%);border-radius:50%;background:#8a5848}
.mi.on .c{box-shadow:0 0 0 2px #E8CFA0,0 8px 18px rgba(0,0,0,.5)}.mi small{display:block;font-size:9.5px;color:rgba(245,237,227,.5);margin-top:8px;letter-spacing:.12em}.mi.on small{color:#E8CFA0}
</style></head><body><div class="w"><div class="eb">Bienvenue chez Skines</div><h2>Un moment pour vous</h2><p class="sub">Choisissez un disque et laissez la musique faire le reste.</p>
<div class="deck"><div class="glow"></div><div class="rec"><div class="lab"><svg viewBox="0 0 40 40" width="34" height="34" fill="none" stroke="currentColor" stroke-width="1.4"><ellipse cx="20" cy="29" rx="11" ry="5.5"/><ellipse cx="20" cy="20" rx="8" ry="4.2"/><ellipse cx="20" cy="12.5" rx="5" ry="3"/></svg></div></div>
<svg class="arm" viewBox="0 0 100 160" fill="none" stroke="#E8CFA0" stroke-width="3" stroke-linecap="round"><circle cx="78" cy="14" r="9" fill="#2a150e"/><path d="M78 23 L78 96 L48 140"/><rect x="38" y="136" width="18" height="12" rx="3" fill="#E8CFA0" stroke="none" transform="rotate(-30 47 142)"/></svg></div>
<div class="now"><b>Om Gam Mantra</b><span>Chantress Seba</span></div><div class="bar"><i></i></div>
<div class="ctl"><span class="sk"><svg width="16" height="16" viewBox="0 0 24 24" fill="currentColor"><path d="M6 5h2v14H6zM20 5v14L9 12z"/></svg></span><span class="pl"><svg width="24" height="24" viewBox="0 0 24 24" fill="currentColor"><path d="M8 5v14l11-7z"/></svg></span><span class="sk"><svg width="16" height="16" viewBox="0 0 24 24" fill="currentColor"><path d="M16 5h2v14h-2zM4 5v14l11-7z"/></svg></span></div>
<div class="row"><div class="mi on"><div class="c"></div><small>01</small></div><div class="mi"><div class="c"></div><small>02</small></div><div class="mi"><div class="c"></div><small>03</small></div><div class="mi"><div class="c"></div><small>04</small></div><div class="mi"><div class="c"></div><small>05</small></div></div>
</div></body></html>
