<!doctype html><html lang="fr"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=DM+Sans:wght@300;400;500;600&family=Pinyon+Script&display=swap">
<style>
*{box-sizing:border-box}body{margin:0;background:#EFDDD4;font-family:'DM Sans',sans-serif;color:#4a2e26;-webkit-font-smoothing:antialiased}
.wrap{padding:44px 22px 40px;text-align:center}
.eyebrow{font:600 .68rem 'DM Sans';letter-spacing:.3em;text-transform:uppercase;color:#B66A5A;margin:0 0 14px}
h2{font:400 1.7rem/1.18 'DM Sans';text-transform:uppercase;letter-spacing:.01em;margin:0 0 6px;color:#3b241d}
h2 em{display:block;font:400 4rem/1 'Pinyon Script';text-transform:none;color:#B66A5A;margin-top:4px}
.gold{width:54px;height:1px;background:#C9973A;margin:18px auto}
/* A: stats with ensō rings */
.stats{display:grid;grid-template-columns:1fr 1fr;gap:26px 10px;margin:26px 0 8px}
.st{position:relative;display:flex;flex-direction:column;align-items:center}
.ring{position:relative;width:118px;height:118px;display:flex;align-items:center;justify-content:center}
.ring svg{position:absolute;inset:0;width:100%;height:100%}
.ring b{font:300 2.1rem/1 'DM Sans';color:#3b241d}
.st span{margin-top:10px;font:500 .64rem 'DM Sans';letter-spacing:.2em;text-transform:uppercase;color:#9A6552}
.chips{display:flex;gap:8px;justify-content:center;flex-wrap:wrap;margin-top:22px}
.chip{border:1px solid rgba(104,64,52,.45);border-radius:999px;padding:11px 16px;font:500 .68rem 'DM Sans';letter-spacing:.14em;text-transform:uppercase;color:#684034}
/* B: quote */
.big{display:flex;align-items:center;justify-content:center;gap:16px;margin-bottom:4px}
.big b{font:300 4.6rem/1 'DM Sans';color:#3b241d}.big small{display:block;font:500 .66rem 'DM Sans';letter-spacing:.24em;color:#9A6552;text-align:left;text-transform:uppercase}
.stars{color:#C9973A;letter-spacing:.18em;font-size:1.1rem;margin:4px 0}
.quote{max-width:330px;margin:20px auto 0;font:italic 400 1.18rem/1.55 'DM Sans';color:#4a2e26}
.who{margin-top:12px;font:500 .66rem 'DM Sans';letter-spacing:.2em;text-transform:uppercase;color:#9A6552}
.dots{display:flex;gap:7px;justify-content:center;margin-top:16px}.dots i{width:6px;height:6px;border-radius:50%;background:#C9973A;opacity:.35}.dots i:first-child{opacity:1}
.pols{display:grid;grid-template-columns:repeat(3,1fr);gap:10px;max-width:340px;margin:28px auto 0}
.pol{background:#FAF1EC;padding:7px 7px 9px;box-shadow:0 8px 16px rgba(74,42,34,.2);font:600 .56rem/1.2 'DM Sans';letter-spacing:.1em;text-transform:uppercase;color:#684034}
.pol:nth-child(1){transform:rotate(-3deg)}.pol:nth-child(2){transform:rotate(2deg) translateY(6px)}.pol:nth-child(3){transform:rotate(-2deg)}
.pol div{aspect-ratio:4/5;background:#cdb3a4 center/cover;margin-bottom:6px}
/* C: badge */
.badge{position:relative;width:170px;margin:6px auto 6px}.badge img{width:100%;display:block;filter:drop-shadow(0 14px 20px rgba(74,42,34,.35))}
.badge:after{content:"";position:absolute;inset:0;background:linear-gradient(115deg,transparent 38%,rgba(255,255,255,.55) 50%,transparent 62%);mix-blend-mode:soft-light}
.two{display:flex;justify-content:center;align-items:center;gap:22px;margin-top:16px}.two div{text-align:center}.two b{display:block;font:300 2.6rem/1 'DM Sans';color:#3b241d}.two small{font:500 .62rem 'DM Sans';letter-spacing:.22em;text-transform:uppercase;color:#9A6552}.two i{width:1px;height:46px;background:rgba(104,64,52,.3)}
.lead{max-width:320px;margin:22px auto 0;font-size:1rem;line-height:1.7;color:#5a3b32}
.link{display:inline-block;margin-top:18px;font:500 .74rem 'DM Sans';letter-spacing:.2em;text-transform:uppercase;color:#684034;border-bottom:1px solid rgba(104,64,52,.5);padding-bottom:6px}
</style></head><body>
<script>
const v=new URLSearchParams(location.search).get('v')||'a';
const ens='<svg viewBox="0 0 120 120"><path d="M60 10C34 9 12 30 12 60s22 51 50 50 48-20 47-48C108 38 90 14 66 12" fill="none" stroke="#B66A5A" stroke-width="2.4" stroke-linecap="round"/><path d="M62 16C38 17 18 36 19 60s20 44 44 43" fill="none" stroke="#E4BBA8" stroke-width="1.4" stroke-linecap="round"/></svg>';
const H='<p class="eyebrow">Avis vérifiés · Petite-Italie</p><h2>Head Spa, soins du visage et épilation laser à<em>Montréal</em></h2>';
const A=`<div class="wrap">${H}<div class="gold"></div>
<div class="stats"><div class="st"><div class="ring">${ens}<b>4,8</b></div><span>Fresha</span></div><div class="st"><div class="ring">${ens}<b>4,7</b></div><span>Google</span></div><div class="st"><div class="ring">${ens}<b>1 750+</b></div><span>Avis clients</span></div><div class="st"><div class="ring">${ens}<b>6 000+</b></div><span>Heures de pratique</span></div></div>
<div class="chips"><span class="chip">Head Spa japonais</span><span class="chip">Soins du visage</span><span class="chip">Épilation laser</span></div></div>`;
const B=`<div class="wrap">${H.replace('Avis vérifiés · Petite-Italie','Ils en parlent mieux que nous')}<div class="gold"></div>
<div class="big"><b>4,8</b><div><div class="stars">★★★★★</div><small>Fresha · 4,7 Google<br>1 750+ avis</small></div></div>
<p class="quote">“I did both a facial and a laser session, and I'm really happy with the results. My skin looks clearer and more radiant.”</p><p class="who">Sabrina I. · Avis vérifié</p><div class="dots"><i></i><i></i><i></i></div>
<div class="pols"><div class="pol"><div style="background-image:url(/assets/head-spa-shampoing-haut.webp)"></div>Head Spa</div><div class="pol"><div style="background-image:url(/assets/card-laser-m.webp)"></div>Laser</div><div class="pol"><div style="background-image:url(/assets/card-facial-m.webp)"></div>Facial</div></div></div>`;
const C=`<div class="wrap"><p class="eyebrow">Récompensé par vos avis</p><div class="badge"><img src="/assets/best-in-class-2026-fresha.webp" alt=""></div>
<div class="two"><div><b>4,8</b><small>Fresha</small></div><i></i><div><b>4,7</b><small>Google</small></div></div><p style="margin:10px 0 0;font:500 .66rem 'DM Sans';letter-spacing:.22em;text-transform:uppercase;color:#9A6552">Plus de 1 750 avis cumulés</p>
<div class="gold"></div><h2>Head Spa, soins du visage et épilation laser à<em>Montréal</em></h2><p class="lead">Un rituel japonais, du soin du cuir chevelu à l'épilation laser. Offrez-vous la pause que vous méritez.</p><a class="link">Découvrir nos soins →</a></div>`;
document.body.innerHTML={a:A,b:B,c:C}[v];
</script></body></html>
